# Environment Configuration

# Device settings
device: cuda # cuda or cpu (auto will detect)

# Output and logging
output_directory: results_xai
log_level: INFO
save_checkpoints: true
checkpoint_interval: 1000 # Save every N episodes

# LLM Configuration (Groq)
llm:
  enabled: false # Set to true to enable LLM explanations
  provider: groq
  model: llama3-8b-8192
  api_key: ${GROQ_API_KEY} # Read from environment variable
  timeout: 30

# Reward penalties and bonuses
reward_tuning:
  charger_visit_penalty: 0.05
  early_return_penalty: 0.3 # Penalty for returning to depot early
  service_bonus: 0.2 # Reward for serving a customer
  completion_bonus: 2.0 # Reward for completing route at depot
  battery_violation_penalty: 1.0

# Warnings and diagnostics
diagnostics:
  track_masked_actions: true
  warn_on_violations: false

# Random seeds
reproducibility:
  seed: 42
  deterministic: true
