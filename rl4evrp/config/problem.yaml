# EVRP Problem Configuration
#
# This file defines the EVRP instance size, resource limits, reward behavior,
# and the feature layout used by the neural network.

problem:
  name: evrp # Problem identifier used in logs and outputs
  n_customers: 20 # Number of customers to place in each instance
  charger_prob: 0.15 # Probability that a non-depot node becomes a charger
  cargo_capacity: 30.0 # Maximum load the vehicle can carry
  battery_capacity: 100.0 # Maximum battery charge the vehicle can hold

instance_generation:
  train_size: 50000 #200 # Number of generated training instances
  eval_size: 100 # Number of held-out evaluation instances
  seed_offset: 0 # Base seed offset for deterministic instance creation

episode:
  n_episodes: 800 # Training episodes per run
  max_steps_factor: 4 # Episode limit = factor * number of nodes

reward:
  default_mode: distance # Default reward mode used by the environment
  modes:
    - distance
    - inverse_distance
  service_bonus: 0.2 # Reward for serving a customer
  completion_bonus: 2.0 # Bonus for returning to depot after all customers are served
  charger_penalty: 0.05 # Small penalty for visiting a charger
  early_return_penalty: 0.3 # Penalty for returning to depot before completing service
  battery_violation_penalty: 1.0 # Penalty when battery feasibility is broken

node_features:
  feature_dim: 7 # Number of input features per node
  names:
    - x # Normalized x-coordinate
    - y # Normalized y-coordinate
    - demand_normalized # Customer demand divided by cargo capacity
    - is_charger # Binary indicator for charger nodes
    - is_depot # Binary indicator for the depot node
    - cargo_capacity_norm # Cargo capacity normalized for the model input
    - battery_capacity_norm # Battery capacity normalized for the model input

metrics:
  collect_traces: true # Collect per-step traces for XAI and debugging
  track_battery_log: true # Store battery level after each step
  track_charger_visits: true # Count how often the route uses chargers
  track_violations: true # Track battery and cargo constraint violations
